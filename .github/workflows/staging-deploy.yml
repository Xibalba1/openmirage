name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy or redeploy. Defaults to `main`, the latest published main image set."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: 20.15.0

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      STAGING_PUBLIC_BASE_URL: ${{ vars.STAGING_PUBLIC_BASE_URL }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Derive image references
        id: images
        run: |
          registry_owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_tag="$(printf '%s' "${{ inputs.image_tag }}" | xargs)"
          if [ -z "$image_tag" ]; then
            image_tag="main"
          fi
          {
            echo "tag=${image_tag}"
            echo "api=ghcr.io/${registry_owner}/openmirage-api:${image_tag}"
            echo "api_tools=ghcr.io/${registry_owner}/openmirage-api-tools:${image_tag}"
            echo "web=ghcr.io/${registry_owner}/openmirage-web:${image_tag}"
            echo "collab=ghcr.io/${registry_owner}/openmirage-collab:${image_tag}"
            echo "worker=ghcr.io/${registry_owner}/openmirage-worker:${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify requested staging images exist in GHCR
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          for image in \
            "${{ steps.images.outputs.api }}" \
            "${{ steps.images.outputs.api_tools }}" \
            "${{ steps.images.outputs.web }}" \
            "${{ steps.images.outputs.collab }}" \
            "${{ steps.images.outputs.worker }}"
          do
            echo "[openmirage] checking published image $image"
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "::error::Published image not found: $image"
              echo "::error::Wait for CI image publication to complete or rerun this workflow with a known-good image_tag."
              exit 1
            fi
          done

      - name: Install SSH key and known hosts
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify staging deploy prerequisites on VPS
        run: |
          ssh -4 \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" <<EOF
          set -euo pipefail
          whoami
          docker --version
          docker compose version
          test -d "$VPS_DEPLOY_DIR"
          test -f "$VPS_DEPLOY_DIR/.env.staging"
          EOF

      - name: Sync checked-in deploy assets to VPS
        run: |
          ssh -4 \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" "mkdir -p \"$VPS_DEPLOY_DIR/docker\""

          scp -4 -i ~/.ssh/id_ed25519 -P "$VPS_PORT" \
            docker-compose.yml \
            docker-compose.staging.yml \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_DIR/"

          scp -4 -i ~/.ssh/id_ed25519 -P "$VPS_PORT" \
            docker/Caddyfile \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_DIR/docker/Caddyfile"

      - name: Pull images, run migrations, and update staging services
        run: |
          ssh -4 \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" <<EOF
          set -euo pipefail

          cd "$VPS_DEPLOY_DIR"
          test -f docker-compose.yml
          test -f docker-compose.staging.yml
          test -f docker/Caddyfile
          test -f .env.staging

          export OPENMIRAGE_API_IMAGE="${{ steps.images.outputs.api }}"
          export OPENMIRAGE_API_TOOLS_IMAGE="${{ steps.images.outputs.api_tools }}"
          export OPENMIRAGE_WEB_IMAGE="${{ steps.images.outputs.web }}"
          export OPENMIRAGE_COLLAB_IMAGE="${{ steps.images.outputs.collab }}"
          export OPENMIRAGE_WORKER_IMAGE="${{ steps.images.outputs.worker }}"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          echo "[openmirage] resolved compose image references"
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml config | grep 'image:'
          echo "[openmirage] pulling deploy images"
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml pull db-migrate api web collab worker caddy
          echo "[openmirage] running database migrations"
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml run --rm -T db-migrate </dev/null
          echo "[openmirage] recreating long-running services"
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d --force-recreate --no-build --no-deps web api collab worker caddy
          echo "[openmirage] verifying deployed service images"
          docker inspect "\$(docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml ps -q web)" --format '{{.Config.Image}}'
          docker inspect "\$(docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml ps -q api)" --format '{{.Config.Image}}'
          EOF

      - name: Smoke check staging public origin
        run: |
          base_url="${STAGING_PUBLIC_BASE_URL%/}"
          test -n "$base_url"

          curl -fsS "$base_url/" >/dev/null
          curl -fsS "$base_url/healthz" >/dev/null
          curl -fsS "$base_url/readyz" >/dev/null
          curl -fsS "$base_url/metrics" >/dev/null
          curl -fsS "$base_url/collab/healthz" >/dev/null
          curl -fsS "$base_url/collab/metrics" >/dev/null
          curl -fsS "$base_url/worker/readyz" >/dev/null
          curl -fsS "$base_url/worker/metrics" >/dev/null
          curl -fsS "$base_url/worker/status" >/dev/null

          headers_file="$(mktemp)"
          curl --http1.1 -sS -o /dev/null -D "$headers_file" \
            -H 'Connection: Upgrade' \
            -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Key: SGVsbG8sIHdvcmxkIQ==' \
            -H 'Sec-WebSocket-Version: 13' \
            "$base_url/collab" || true

          grep -Eq '^HTTP/1\.1 (101|401)' "$headers_file"
          node ./scripts/verify-staging-deploy.mjs
