name: GHCR Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build smoke image
        run: |
          cat > Dockerfile.ghcr-smoke <<'EOF'
          FROM alpine:3.20
          CMD ["echo", "ghcr smoke ok"]
          EOF
          docker build -f Dockerfile.ghcr-smoke -t ghcr.io/xibalba1/openmirage-ghcr-smoke:${{ github.sha }} .

      - name: Push smoke image
        run: docker push ghcr.io/xibalba1/openmirage-ghcr-smoke:${{ github.sha }}
