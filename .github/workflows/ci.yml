name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: 20.15.0
  PNPM_VERSION: 9.15.0

jobs:
  static-validation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://openmirage:openmirage@127.0.0.1:5432/openmirage

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openmirage
          POSTGRES_USER: openmirage
          POSTGRES_PASSWORD: openmirage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmirage -d openmirage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 5432; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become reachable on 127.0.0.1:5432" >&2
          exit 1

      - name: Apply migrations
        run: pnpm db:migrate:up

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build

  browser-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke
        run: pnpm test:browser

  docker-build-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - image_name: api-tools
            dockerfile: apps/api/Dockerfile
            target: tools
          - image_name: web
            dockerfile: apps/web/Dockerfile
            target: runtime
          - image_name: collab
            dockerfile: apps/collab/Dockerfile
            target: runtime
          - image_name: worker
            dockerfile: apps/worker/Dockerfile
            target: runtime

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image_name }} image
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --target "${{ matrix.target }}" \
            --tag "openmirage/${{ matrix.image_name }}:ci-${GITHUB_SHA}" \
            .

  migration-safety:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://openmirage:openmirage@127.0.0.1:5432/openmirage

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openmirage
          POSTGRES_USER: openmirage
          POSTGRES_PASSWORD: openmirage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmirage -d openmirage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 5432; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become reachable on 127.0.0.1:5432" >&2
          exit 1

      - name: Apply migrations
        run: pnpm db:migrate:up

      - name: Verify migration status
        run: pnpm db:migrate:status

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - static-validation
      - browser-smoke
      - docker-build-validation
      - migration-safety
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - image_name: api-tools
            dockerfile: apps/api/Dockerfile
            target: tools
          - image_name: web
            dockerfile: apps/web/Dockerfile
            target: runtime
          - image_name: collab
            dockerfile: apps/collab/Dockerfile
            target: runtime
          - image_name: worker
            dockerfile: apps/worker/Dockerfile
            target: runtime

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Derive lowercase registry owner
        id: registry-owner
        run: |
          value="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image
        run: |
          image="ghcr.io/${{ steps.registry-owner.outputs.value }}/openmirage-${{ matrix.image_name }}"
          {
            echo "name=$image"
            echo "sha_tag=$image:${GITHUB_SHA}"
            echo "main_tag=$image:main"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.main_tag }}
